[package]
name = "supplychain-contract"
version = "0.1.0"
description = "A Soroban smart contract for supply chain management"
authors = ["Your Name <your.email@example.com>"]
edition = "2021"
repository = "https://github.com/yourusername/supplychain-contract"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "=20.5.0"  # Sử dụng version chính xác

[dev-dependencies]
soroban-sdk = { version = "=20.5.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
strip = "symbols"
panic = "abort"
lto = true
codegen-units = 1